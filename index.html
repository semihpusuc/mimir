<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="description" content="Mimir: überraschende Fakten statt Doomscrolling">
<title>Mimir</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen vertical feed with scroll snap (one fact per screen), action rail on the right, overlay header, "Gemerkt" panel on top */
:root{
  --bg:#07080d; --surface:#0f1118; --surface-2:#171a26; --line:rgba(255,255,255,.08);
  --text:#eef0f7; --muted:#9097ad; --like:#4ade80; --nope:#ff5c6c; --star:#ffd166;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:12px}

/* Header overlay */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 22px;background:linear-gradient(180deg,rgba(7,8,13,.85),rgba(7,8,13,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:20px}
.brand img{width:26px;height:26px;border-radius:7px}
.tabs{display:flex;gap:3px;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);backdrop-filter:blur(8px)}
.tabs button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--bg)}
.count{font-family:var(--mono);font-size:11px;min-width:18px;padding:1px 5px;border-radius:999px;background:var(--star);color:#1a1405;text-align:center}
.count[data-zero="true"]{background:rgba(255,255,255,.12);color:var(--muted)}

/* Feed */
.feed{position:fixed;inset:0;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;touch-action:pan-y}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;will-change:transform;transition:transform .4s cubic-bezier(.2,.9,.25,1),opacity .3s}
.inner.dragging{transition:none}
.glow{position:absolute;inset:-10%;background:radial-gradient(60% 45% at 50% 28%,color-mix(in oklab,var(--c) 38%,transparent),transparent 70%),radial-gradient(50% 40% at 80% 90%,color-mix(in oklab,var(--c) 18%,transparent),transparent 70%);pointer-events:none}
.visual{position:relative;flex:0 0 44%;margin-top:calc(env(safe-area-inset-top) + 56px);color:var(--c)}
.visual svg{position:absolute;inset:0;width:100%;height:100%}
.info{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:0 84px calc(env(safe-area-inset-bottom) + 26px) 18px}
.chip{align-self:flex-start;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c);
  padding:5px 10px;border-radius:999px;background:color-mix(in oklab,var(--c) 16%,transparent);border:1px solid color-mix(in oklab,var(--c) 32%,transparent)}
.hook{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(23px,6.6vw,30px);line-height:1.1;letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.teaser{margin:0;font-size:15px;line-height:1.45;color:#c4c9d9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Right action rail */
.rail{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column;gap:16px;align-items:center;z-index:3}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-family:var(--mono);color:var(--muted)}
.act i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(15,17,24,.6);border:1px solid var(--line);backdrop-filter:blur(8px);transition:transform .15s,background .2s,color .2s}
.act:active i{transform:scale(.88)}
.act svg{width:24px;height:24px}
.act.star[aria-pressed="true"] i{color:var(--star);border-color:color-mix(in oklab,var(--star) 50%,transparent)}

/* Swipe stamps */
.stamp{position:absolute;top:calc(env(safe-area-inset-top) + 96px);z-index:4;font-family:var(--display);font-weight:800;font-size:30px;padding:2px 14px;border:3px solid;border-radius:12px;opacity:0;pointer-events:none}
.stamp.like{left:22px;color:var(--like);transform:rotate(-12deg)}
.stamp.nope{right:22px;color:var(--nope);transform:rotate(12deg)}

/* Details sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;z-index:6;display:flex;flex-direction:column;border-radius:24px 24px 0 0;
  background:rgba(15,17,24,.96);border-top:1px solid color-mix(in oklab,var(--c) 35%,var(--line));box-shadow:0 -20px 60px rgba(0,0,0,.6);
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.slide.open .sheet{transform:none}
.sheet .grab{display:flex;align-items:center;padding:14px 18px 10px;touch-action:none}
.sheet .grab span{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:0 auto}
.sheet .scroll{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:4px 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--display);font-size:21px;line-height:1.2}
.sheet p{margin:0;font-size:15.5px;line-height:1.55;color:#c4c9d9}
.ice{border-left:2px solid var(--c);padding:10px 14px;background:rgba(255,255,255,.04)}
.ice small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ice p{font-style:italic;color:var(--text)}
.src{font-size:12.5px;color:var(--muted)} .src a{color:var(--muted)}
.close{align-self:flex-start;font-size:13px;font-weight:600;color:var(--muted);padding:6px 0}

/* First-run hint */
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);z-index:15;padding:10px 16px;border-radius:999px;
  background:rgba(23,26,38,.92);border:1px solid var(--line);font-size:13.5px;font-weight:500;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint b{display:inline-block;animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
.hint.gone{opacity:0}

/* "Gemerkt" panel */
.panel{position:fixed;inset:0;z-index:18;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 72px) 16px calc(env(safe-area-inset-bottom) + 24px);display:none;flex-direction:column;gap:12px}
.panel.show{display:flex}
.panel h2{font-family:var(--display);font-size:22px;margin:6px 2px 0}
.panel .lead{margin:0 2px 4px;color:var(--muted);font-size:14px}
.export{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.16)}
.export strong{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px}
.export span{font-size:14px;line-height:1.45;color:var(--muted)}
.pill-btn{align-self:flex-start;padding:12px 20px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600}
.export textarea{width:100%;height:120px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:11px;padding:10px}
.item{position:relative;border-radius:20px;padding:16px 16px 16px 18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.item h3{margin:0;font-family:var(--display);font-size:17px;line-height:1.25;padding-right:40px}
.item p{margin:0;font-size:14.5px;line-height:1.45;color:#c4c9d9;font-style:italic}
.item .unsave{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--star)}
.item .unsave svg{width:18px;height:18px}
.empty{color:var(--muted);line-height:1.5;margin:8px 2px}
.foot{margin-top:8px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 110px);transform:translate(-50%,20px);opacity:0;z-index:40;
  padding:10px 16px;border-radius:999px;background:rgba(23,26,38,.95);border:1px solid var(--line);font-size:13.5px;font-weight:500;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Illustration helpers */
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.seat{animation:seat 8.4s infinite;fill:transparent}
@keyframes seat{0%,12%{fill:currentColor}14%,100%{fill:transparent}}
.orbit{transform-origin:180px 110px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  .inner,.sheet{transition:none}.hint b,.blink,.pulse,.seat,.orbit{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="icons/icon-64.png" alt="">Mimir</div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-feed" aria-selected="true">Entdecken</button>
    <button role="tab" id="tab-saved" aria-selected="false">Gemerkt <span class="count" id="savedCount">0</span></button>
  </div>
</header>

<main class="feed" id="feed" aria-label="Fakten-Feed"></main>
<div class="hint gone" id="hint" aria-hidden="true"><b>↑</b> weiter · ← Nö · Gut → · Tippen = mehr</div>

<section class="panel" id="panel" aria-label="Gemerkte Fakten"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TOPICS = {
  "Technik":   "#3dd6f5",
  "AI":        "#a78bfa",
  "Politik":   "#ff7a6b",
  "Geschichte":"#f5b84d",
  "Sci-Fi":    "#f472d0",
  "Basketball":"#ff8a3d",
  "Geld":      "#7ee081",
  "Invest":    "#2dd4bf"
};

/* ---------- Illustrations (360 × 220, drawn in the card's topic colour) ---------- */
const T = (x,y,s,o={}) => `<text x="${x}" y="${y}" font-family="var(--mono)" font-size="${o.size||11}" fill="${o.fill||'#9097ad'}" text-anchor="${o.anchor||'middle'}" ${o.weight?`font-weight="${o.weight}"`:''} ${o.family?`style="font-family:${o.family}"`:''}>${s}</text>`;

const ART = {
  coffee(){
    let lines=''; for(let y=34;y<170;y+=6) lines+=`<line x1="112" y1="${y}" x2="248" y2="${y}" stroke="currentColor" opacity=".07"/>`;
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      <rect x="110" y="30" width="140" height="142" rx="8" fill="rgba(0,0,0,.35)" stroke="currentColor" stroke-opacity=".35"/>
      ${lines}
      <path d="M104 44V24h20M256 44V24h-20M104 158v20h20M256 158v20h-20" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="126" cy="46" r="4" fill="#ff5c6c" class="blink"/>${T(146,49,'REC',{size:9,fill:'#ff5c6c',anchor:'start'})}
      <rect x="150" y="60" width="60" height="10" rx="3" fill="currentColor" opacity=".8"/>
      <path d="M216 82q22 0 20 26-2 22-22 24" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M146 120h68l4 30q0 8-8 8h-60q-8 0-8-8z" fill="currentColor" opacity=".35"/>
      <path d="M152 70h56l10 80q0 8-8 8h-60q-8 0-8-8z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      ${T(180,200,'128 × 128 px · Cambridge 1991')}
    </svg>`;
  },
  bluetooth(){
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
        <path d="M70 50v120M45 85l50 50M95 85l-50 50"/>
        <path d="M150 50v120M150 50l35 30-35 30 35 30-35 30"/>
      </g>
      ${T(110,116,'+',{size:26,fill:'#eef0f7'})}
      ${T(222,116,'=',{size:26,fill:'#eef0f7'})}
      <path d="M255 80l60 60-30 30V50l30 30-60 60" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 10px currentColor)"/>
      ${T(70,200,'Rune H')}${T(160,200,'Rune B')}${T(285,200,'Bluetooth')}
    </svg>`;
  },
  eliza(){
    const rows=[['> Männer sind alle gleich.','#eef0f7'],['IN WELCHER WEISE?','c'],['> Sie nerven uns ständig.','#eef0f7'],['KANNST DU EIN BEISPIEL NENNEN?','c'],['> Mein Freund hat mich hergeschickt.','#eef0f7'],['DEIN FREUND HAT DICH HERGESCHICKT?','c']];
    const txt=rows.map((r,i)=>`<text x="56" y="${70+i*20}" font-family="var(--mono)" font-size="10.5" fill="${r[1]==='c'?'currentColor':r[1]}">${r[0]}</text>`).join('');
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      <rect x="40" y="22" width="280" height="186" rx="12" fill="rgba(0,0,0,.4)" stroke="rgba(255,255,255,.12)"/>
      <circle cx="58" cy="38" r="4" fill="#ff5c6c" opacity=".7"/><circle cx="72" cy="38" r="4" fill="#ffd166" opacity=".7"/><circle cx="86" cy="38" r="4" fill="#4ade80" opacity=".7"/>
      ${T(304,41,'MIT · 1966',{size:9.5,anchor:'end'})}
      ${txt}
      <rect x="56" y="186" width="8" height="12" fill="currentColor" class="blink"/>
    </svg>`;
  },
  move37(){
    let g=''; for(let i=0;i<9;i++){g+=`<line x1="${100+i*20}" y1="30" x2="${100+i*20}" y2="190" stroke="#eef0f7" stroke-opacity=".18"/><line x1="100" y1="${30+i*20}" x2="260" y2="${30+i*20}" stroke="#eef0f7" stroke-opacity=".18"/>`;}
    const B=[[2,2],[3,5],[6,6],[2,4],[4,6]], W=[[2,6],[6,2],[7,3],[6,4],[3,3]];
    const st=(a,f,s)=>a.map(([i,j])=>`<circle cx="${100+i*20}" cy="${30+j*20}" r="8.5" fill="${f}" stroke="${s}"/>`).join('');
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      <rect x="88" y="18" width="184" height="184" rx="6" fill="currentColor" fill-opacity=".06"/>
      ${g}${st(B,'#151722','rgba(255,255,255,.35)')}${st(W,'#e9ecf5','none')}
      <circle cx="200" cy="90" r="9" fill="none" stroke="currentColor" stroke-width="2" class="pulse"/>
      <circle cx="200" cy="90" r="8.5" fill="#151722" stroke="currentColor" stroke-width="2.5"/>
      ${T(200,94,'37',{size:8,fill:'currentColor',weight:700})}
      ${T(46,104,'Zug',{size:10})}<text x="46" y="140" text-anchor="middle" font-family="var(--display)" font-weight="800" font-size="38" fill="currentColor">37</text>
      ${T(314,104,'Chance',{size:10})}<text x="314" y="128" text-anchor="middle" font-family="var(--display)" font-weight="800" font-size="18" fill="#eef0f7">1 :</text><text x="314" y="148" text-anchor="middle" font-family="var(--display)" font-weight="800" font-size="18" fill="#eef0f7">10.000</text>
      ${T(180,214,'schematisch · Seoul 2016',{size:9.5})}
    </svg>`;
  },
  swiss(){
    let seats=''; for(let k=0;k<7;k++){const a=Math.PI*(1-k/6);const x=180+112*Math.cos(a),y=146-112*Math.sin(a);
      seats+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" class="seat" style="animation-delay:${k*1.2}s" stroke="currentColor" stroke-width="2.5"/>`;}
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      <path d="M68 146a112 112 0 0 1 224 0" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 6"/>
      ${seats}
      <rect x="162" y="96" width="36" height="36" rx="5" fill="#e3263b"/><path d="M176 103h8v8h8v8h-8v8h-8v-8h-8v-8h8z" fill="#fff"/>
      ${T(180,188,'7 gleichberechtigte Mitglieder',{size:10.5,fill:'#eef0f7'})}
      ${T(180,206,'Vorsitz rotiert jährlich')}
    </svg>`;
  },
  cleo(){
    const X=y=>30+(y+2600)*0.0652, p=X(-2560), c=X(-30), m=X(1969);
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      <line x1="20" y1="120" x2="340" y2="120" stroke="#eef0f7" stroke-opacity=".25" stroke-width="2"/>
      <path d="M${p} 120l-15 0 15-34 15 34z" fill="#f5b84d" opacity=".85" transform="translate(12 0)"/>
      <circle cx="${c}" cy="104" r="11" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="${c}" cy="104" r="3.5" fill="currentColor"/>
      <path d="M${m-4} 92a13 13 0 1 0 0 24a10 10 0 1 1 0-24z" fill="#eef0f7"/>
      ${[p+12,c,m-6].map(x=>`<circle cx="${x}" cy="120" r="4" fill="#eef0f7"/>`).join('')}
      ${T(p+2,72,'Pyramide',{anchor:'start',fill:'#eef0f7'})}${T(p+2,58,'2560 v. Chr.',{anchor:'start',size:10})}
      ${T(c,72,'Kleopatra',{fill:'#eef0f7'})}${T(c,58,'† 30 v. Chr.',{size:10})}
      ${T(m+2,72,'Mond',{anchor:'end',fill:'#eef0f7'})}${T(m+2,58,'1969',{anchor:'end',size:10})}
      <path d="M${p+12} 140v8h${c-p-14}v-8" fill="none" stroke="#9097ad" stroke-width="1.5"/>
      <path d="M${c+2} 140v8h${m-c-8}v-8" fill="none" stroke="currentColor" stroke-width="2"/>
      ${T((p+c)/2+6,172,'≈ 2.530 Jahre',{size:12})}
      ${T((c+m)/2-2,172,'≈ 2.000 Jahre',{size:12,fill:'currentColor',weight:700})}
      ${T(180,206,'maßstabsgetreu',{size:9.5})}
    </svg>`;
  },
  robot(){
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      <line x1="180" y1="16" x2="180" y2="30" stroke="currentColor" stroke-width="3"/><circle cx="180" cy="14" r="4" fill="currentColor" class="blink"/>
      <rect x="150" y="30" width="60" height="50" rx="12" fill="rgba(0,0,0,.35)" stroke="currentColor" stroke-width="3"/>
      <circle cx="167" cy="52" r="5" fill="currentColor"/><circle cx="193" cy="52" r="5" fill="currentColor"/>
      <path d="M168 68h24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <text x="180" y="142" text-anchor="middle" font-family="var(--display)" font-weight="800" font-size="50" letter-spacing="-1" fill="#eef0f7">robota</text>
      ${T(180,172,'tschechisch: Fronarbeit',{size:11.5,fill:'currentColor'})}
      ${T(180,200,'R.U.R. · Prag 1920')}
    </svg>`;
  },
  clarke(){
    const sat=a=>{const r=88,x=180+r*Math.cos(a),y=110+r*Math.sin(a);return {x,y};};
    const s=[-Math.PI/2,Math.PI/6,5*Math.PI/6].map(sat);
    const sats=s.map(p=>`<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"><rect x="-4" y="-4" width="8" height="8" fill="#eef0f7"/><rect x="-16" y="-2" width="10" height="4" fill="currentColor"/><rect x="6" y="-2" width="10" height="4" fill="currentColor"/></g>`).join('');
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      <circle cx="180" cy="110" r="88" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="4 6"/>
      <circle cx="180" cy="110" r="36" fill="#0f1a2e" stroke="#3dd6f5" stroke-opacity=".6" stroke-width="1.5"/>

const capSvg=(c,y)=>c?T(180,y,esc(c),{size:c.length>44?10:11.5,fill:'#c9cde0'}):'';
const ARTT = {
  bignum(a){
    const txt=a.big+(a.unit?' '+a.unit:'');
    const size=txt.length<=6?64:txt.length<=9?50:txt.length<=12?40:32;
    return `<svg viewBox="0 0 360 220" aria-hidden="true">
      ${T(180,112,esc(txt),{size,fill:'currentColor',weight:700})}
      ${capSvg(a.cap,150)}
      ${a.sub?T(180,176,esc(a.sub),{size:10.5}):''}
    </svg>`;
  },
  timeline(a){
    const it=a.items, ys=it.map(i=>i.y), lo=Math.min(...ys), hi=Math.max(...ys), span=Math.max(1,hi-lo);
    /* Positionen nach Jahr verteilen, aber mit Mindestabstand, damit Beschriftungen nicht überlappen */
    const xs=it.map(i=>100+(i.y-lo)/span*160);
    for(let k=1;k<xs.length;k++) xs[k]=Math.max(xs[k],xs[k-1]+58);
    const over=xs[xs.length-1]-262; if(over>0) for(let k=0;k<xs.length;k++) xs[k]=Math.max(xs[k]-over,k*58+70);
    const pts=it.map((i,n)=>{

      return `<circle cx="${x}" cy="104" r="6" fill="currentColor"/>
        ${T(x,86,i.y,{size:15,fill:'#eef0f7',weight:700})}

      <line x1="40" y1="104" x2="320" y2="104" stroke="currentColor" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>

    const rows=a.rows.map((r,n)=>{

    }).join('');
    return `<svg viewBox="0 0 360 220" aria-hidden="true">${rows}${capSvg(a.cap,200)}</svg>`;
  },
  icon(a){
    return `<svg viewBox="0 0 360 220" aria-hidden="true">

function artSvg(f){

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Speicher: alles bleibt im Browser auf dem Handy ---------- */
const LKEY="funke.votes.v1";             /* alter Name, damit bisherige Bewertungen erhalten bleiben */
let votes={};
try{ votes=JSON.parse(localStorage.getItem(LKEY)||"{}")||{}; }catch(e){ votes={}; }
const rec=id=>(votes[id] ||= {vote:null,saved:false});
let saveT=null;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(LKEY,JSON.stringify(votes)); }catch(e){} },200); }
let persistent=false;
(async()=>{ try{ persistent=!!(navigator.storage&&navigator.storage.persist&&await navigator.storage.persist()); }catch(e){} })();

/* ---------- Export für Claude ---------- */
function exportText(){
  const rows=FACTS.filter(f=>votes[f.id]).map(f=>{ const v=votes[f.id]; return {
    id:f.id, topic:f.topic, vote:v.vote||null, saved:!!v.saved,
    seconds:Math.round((v.ms||0)/100)/10, views:v.views||0, more:!!v.more, hook:f.hook }; });
  return JSON.stringify({app:"mimir",version:APP_VERSION,exportedAt:new Date().toISOString(),count:rows.length,votes:rows},null,1);
}
async function copyExport(){
  const txt=exportText();
  try{ await navigator.clipboard.writeText(txt); toast('Kopiert. Jetzt im Chat mit Claude einfügen'); }
  catch(e){ const ta=document.getElementById('exportBox'); ta.hidden=false; ta.value=txt; ta.focus(); ta.select(); toast('Text markiert. Bitte manuell kopieren'); }
}

/* ---------- Reihenfolge: Ungesehenes zuerst, dann Gesehenes ohne Wertung, dann der Rest ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function firstRound(){
  const unseen=[],skipped=[],rated=[];
  FACTS.forEach(f=>{ const v=votes[f.id]; if(!v||(!v.vote&&!v.views)) unseen.push(f); else if(!v.vote) skipped.push(f); else rated.push(f); });
  const newFirst=a=>shuffle(a.filter(f=>(f.v||1)>=2)).concat(shuffle(a.filter(f=>(f.v||1)<2)));
  return newFirst(unseen).concat(shuffle(skipped)).concat(shuffle(rated));
}

/* ---------- Feed ---------- */
const feed=document.getElementById('feed');
let round=0;
function slideEl(f){
  const s=document.createElement('section');
  s.className='slide'; s.dataset.id=f.id;
  s.style.setProperty('--c',TOPICS[f.topic]);
  const v=votes[f.id]||{};
  s.innerHTML=`
   <div class="inner">
    <div class="glow"></div>
    <div class="stamp like">GUT</div><div class="stamp nope">NÖ</div>
    <div class="visual">${artSvg(f)}</div>
    <div class="info">
      <span class="chip">${esc(f.topic)}${round>1?' · nochmal':''}</span>
      <h2 class="hook">${esc(f.hook)}</h2>

      <span class="more">Tippen für mehr</span>
    </div>
    <div class="rail">
      <button class="act star" aria-pressed="${!!v.saved}" aria-label="Als Icebreaker merken"><i>${ICON.star}</i>Merken</button>
      <button class="act moreb" aria-label="Ganzen Fakt anzeigen"><i>${ICON.more}</i>Mehr</button>
    </div>

     <div class="grab"><span></span></div>

       <h3>${esc(f.hook)}</h3>

       <button class="close">Schließen</button>
     </div>
   </div>`;
  wire(s,f);
  return s;
}
function appendRound(){
  round++;
  const list = round===1 ? firstRound() : shuffle(FACTS.slice());
  list.forEach(f=>{ const el=slideEl(f); feed.appendChild(el); io.observe(el); });
}

/* ---------- Verweildauer: wie lange ein Fakt auf dem Bildschirm war ---------- */
let current=null, since=0;
function leave(){ if(current){ const r=rec(current.dataset.id); r.ms=(r.ms||0)+(performance.now()-since); persist(); } current=null; }
function enter(el){ leave(); current=el; since=performance.now(); const r=rec(el.dataset.id); r.views=(r.views||0)+1; persist(); }
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting && e.intersectionRatio>=.6 && current!==e.target && !panelOpen){
      enter(e.target);
      const slides=feed.children, i=Array.prototype.indexOf.call(slides,current);
      if(i>slides.length-4) appendRound();
      if(i>0) hideHint();
    }
  });
},{root:feed,threshold:[.6]});
function visibleSlide(){ return [...feed.children].find(x=>Math.abs(x.getBoundingClientRect().top)<10); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) leave(); else if(!panelOpen){ const s=visibleSlide(); if(s){ current=s; since=performance.now(); } } });

/* ---------- Aktionen ---------- */
function next(s){ const n=s.nextElementSibling; if(n) feed.scrollTo({top:n.offsetTop,behavior:'smooth'}); }
function buzz(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }

function wire(s,f){
  const id=f.id, inner=s.querySelector('.inner');
  const openSheet=()=>{ s.classList.add('open'); rec(id).more=true; persist(); };
  s.querySelector('.act.star').onclick=e=>{
    e.stopPropagation(); const r=rec(id); r.saved=!r.saved; persist();
    e.currentTarget.setAttribute('aria-pressed',r.saved); renderSavedCount(); buzz(r.saved?[10,40,10]:8);
    toast(r.saved?'Als Icebreaker gemerkt':'Nicht mehr gemerkt');
  };
  s.querySelector('.act.moreb').onclick=e=>{ e.stopPropagation(); openSheet(); };
  s.querySelector('.close').onclick=e=>{ e.stopPropagation(); s.classList.remove('open'); };

  /* Tippen = Details, seitwärts ziehen = bewerten */
  let sx=0,sy=0,dx=0,dy=0,pid=null,drag=false,t0=0;
  const like=s.querySelector('.stamp.like'), nope=s.querySelector('.stamp.nope');
  inner.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,a')) return;
    if(s.classList.contains('open')){ s.classList.remove('open'); return; }
    pid=e.pointerId; sx=e.clientX; sy=e.clientY; dx=dy=0; drag=false; t0=performance.now();
  });
  inner.addEventListener('pointermove',e=>{
    if(pid!==e.pointerId) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    if(!drag){ if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.2){ drag=true; inner.classList.add('dragging'); try{inner.setPointerCapture(pid);}catch(_){} } else return; }
    inner.style.transform=`translate(${dx}px,0) rotate(${dx*.04}deg)`;
    const p=Math.min(Math.abs(dx)/110,1); like.style.opacity=dx>0?p:0; nope.style.opacity=dx<0?p:0;
  });
  const end=e=>{
    if(pid!==e.pointerId) return; pid=null;
    if(drag){
      drag=false; inner.classList.remove('dragging');
      const w=s.offsetWidth, v=Math.abs(dx)/Math.max(1,performance.now()-t0);
      if(e.type!=='pointercancel' && (Math.abs(dx)>w*.28 || (v>.6&&Math.abs(dx)>40))){
        const dir=dx>0?1:-1; rec(id).vote = dir>0?'like':'nope'; persist(); buzz(dir>0?18:10);
        inner.style.transform=`translate(${dir*130}%,0) rotate(${dir*18}deg)`; inner.style.opacity='0';
        setTimeout(()=>{ next(s); setTimeout(()=>{ inner.style.transition='none'; inner.style.transform=''; inner.style.opacity=''; like.style.opacity=nope.style.opacity=0; void inner.offsetWidth; inner.style.transition=''; },450); },260);
      } else { inner.style.transform=''; like.style.opacity=nope.style.opacity=0; }
      return;
    }
    if(e.type==='pointerup' && Math.hypot(e.clientX-sx,e.clientY-sy)<12 && performance.now()-t0<500) openSheet();
  };
  inner.addEventListener('pointerup',end); inner.addEventListener('pointercancel',end);

  /* Details-Blatt nach unten wegwischen: am Griff immer, im Text nur ganz oben */
  const sheet=s.querySelector('.sheet'), sc=sheet.querySelector('.scroll');
  let y0=0,ys=0,t1=0,pull=false,startTop=0;
  sheet.addEventListener('touchstart',e=>{ y0=e.touches[0].clientY; ys=0; t1=performance.now(); pull=false; startTop=sc.scrollTop; },{passive:true});
  sheet.addEventListener('touchmove',e=>{
    const d=e.touches[0].clientY-y0;
    const atTop=sc.scrollTop<=0 && startTop<=0, noScroll=sc.scrollHeight<=sc.clientHeight+1;
    if(d>0 && (atTop || e.target.closest('.grab'))){ e.preventDefault(); if(!pull){ pull=true; sheet.style.transition='none'; } ys=d; sheet.style.transform=`translateY(${d}px)`; }
    else if(d<0 && noScroll){ e.preventDefault(); }
  },{passive:false});
  sheet.addEventListener('touchend',()=>{
    if(!pull) return; pull=false;
    const v=ys/Math.max(1,performance.now()-t1);
    sheet.style.transition=''; sheet.style.transform='';
    if(ys>sheet.offsetHeight*.25 || (v>.5&&ys>40)) s.classList.remove('open');
  });
}

/* ---------- Hinweis beim ersten Start ---------- */
const hint=document.getElementById('hint');
function hideHint(){ hint.classList.add('gone'); try{ localStorage.setItem('mimir.hint.v3','1'); }catch(e){} }
try{ if(!localStorage.getItem('mimir.hint.v3')) hint.classList.remove('gone'); }catch(e){}

/* ---------- Gemerkt ---------- */
const panel=document.getElementById('panel');
let panelOpen=false;
function renderSavedCount(){
  const n=Object.values(votes).filter(v=>v.saved).length;
  const c=document.getElementById('savedCount'); c.textContent=n; c.dataset.zero=n===0;
}
function renderSaved(){
  const items=FACTS.filter(f=>votes[f.id]&&votes[f.id].saved);
  panel.innerHTML=`
    <div class="export"><div><strong>Neue Fakten holen</strong><span>Kopiere deine Bewertungen und füge sie im Chat mit Claude ein. Daraus entsteht das nächste Faktenpaket.</span></div>
      <button class="pill-btn" id="btnExport">Bewertungen kopieren</button><textarea id="exportBox" hidden readonly aria-label="Bewertungen als Text"></textarea></div>
    <h2>Deine Icebreaker</h2>
    ${items.length ? `<p class="lead">${items.length===1?'1 Fakt':items.length+' Fakten'}, bereit fürs nächste Gespräch.</p>`+
      items.map(f=>`<div class="item" style="--c:${TOPICS[f.topic]}"><span class="chip">${esc(f.topic)}</span><h3>${esc(f.hook)}</h3><p>„${esc(f.ice)}“</p>
        <button class="unsave" data-id="${f.id}" aria-label="Nicht mehr merken">${ICON.star}</button></div>`).join('')
      : `<p class="empty">Noch nichts gemerkt. Tippe beim Entdecken auf den Stern, um einen Fakt als Icebreaker zu sammeln.</p>`}
    <p class="foot">Mimir ${APP_VERSION} · ${FACTS.length} Fakten · ${persistent?'dauerhaft':'auf diesem Gerät'} gespeichert</p>`;
  document.getElementById('btnExport').onclick=copyExport;
  panel.querySelectorAll('.unsave').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id; rec(id).saved=false; persist(); renderSaved(); renderSavedCount();
    const sl=feed.querySelector(`.slide[data-id="${id}"] .act.star`); if(sl) sl.setAttribute('aria-pressed','false');
  });
}
function syncStars(){ feed.querySelectorAll('.slide').forEach(s=>{ const b=s.querySelector('.act.star'); b.setAttribute('aria-pressed',!!(votes[s.dataset.id]&&votes[s.dataset.id].saved)); }); }
function show(v){
  const saved=v==='saved';
  document.getElementById('tab-feed').setAttribute('aria-selected',!saved);
  document.getElementById('tab-saved').setAttribute('aria-selected',saved);
  if(saved){ leave(); panelOpen=true; renderSaved(); panel.classList.add('show'); panel.scrollTop=0; }
  else { panel.classList.remove('show'); panelOpen=false; syncStars(); const s=visibleSlide(); if(s){ current=s; since=performance.now(); } }
}
document.getElementById('tab-feed').onclick=()=>show('feed');
document.getElementById('tab-saved').onclick=()=>show('saved');

let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }

/* Tastatur (zum Testen am Computer): Pfeil rechts/links bewerten, Pfeil runter weiter, S merken */
document.addEventListener('keydown',e=>{
  if(panelOpen||!current) return;
  const f=byId[current.dataset.id];
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ rec(f.id).vote=e.key==='ArrowRight'?'like':'nope'; persist(); next(current); }
  else if(e.key==='s') current.querySelector('.act.star').click();
});

/* ---------- Start ---------- */
renderSavedCount();
appendRound();
window.addEventListener('pagehide',()=>{ leave(); try{ localStorage.setItem(LKEY,JSON.stringify(votes)); }catch(e){} });
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
